# Hosted Runway on one machine (spec 05 sections 7-8): api, worker, web and Postgres.
#
# Every secret is a placeholder read from the environment (the host's secret
# store or an untracked env file passed with --env-file); `:?` makes compose
# refuse to start when one is missing. Nothing here is a real credential.
#
#   docker compose -f deploy/compose.hosted.yml --env-file /etc/runway/hosted.env build api web
#   docker compose -f deploy/compose.hosted.yml --env-file /etc/runway/hosted.env up -d postgres
#   docker compose -f deploy/compose.hosted.yml --env-file /etc/runway/hosted.env run --rm migrate
#   docker compose -f deploy/compose.hosted.yml --env-file /etc/runway/hosted.env up -d api worker web
#
# A TLS reverse proxy on the host (Caddy, nginx or a Cloudflare Tunnel) serves
# the web origin and the API origin and forwards to the loopback ports below.
# See docs/HOSTED_DEPLOY.md.

name: runway-hosted

# Least privilege: the shared block below carries configuration only. Each
# service adds just the secrets it uses: the API the Clerk webhook secret, the
# worker the token keys and platform app credentials, migrate neither.
x-runway-env: &runway-env
  RUNWAY_PROFILE: hosted
  RUNWAY_HOST: 0.0.0.0
  RUNWAY_API_PORT: "8000"
  RUNWAY_DATA_DIR: /data
  RUNWAY_PLATFORM_PROVIDER: ${RUNWAY_PLATFORM_PROVIDER:-live}
  RUNWAY_PUBLISHING_PAUSED: ${RUNWAY_PUBLISHING_PAUSED:-false}
  RUNWAY_IDENTITY_PROVIDER: clerk
  RUNWAY_CLERK_ISSUER: ${RUNWAY_CLERK_ISSUER:?Clerk Frontend API URL, https://...}
  RUNWAY_CLERK_JWKS_URL: ${RUNWAY_CLERK_JWKS_URL:-}
  RUNWAY_WEB_ORIGINS: ${RUNWAY_WEB_ORIGINS:?https origin of the web app}
  RUNWAY_WEB_BASE_URL: ${RUNWAY_WEB_BASE_URL:-}
  RUNWAY_OAUTH_REDIRECT_BASE_URL: ${RUNWAY_OAUTH_REDIRECT_BASE_URL:?https origin of the API}
  # Only the host's reverse proxy may set X-Forwarded-For. It reaches the api
  # container through the network gateway below; the web, worker and postgres
  # containers are on the same network but are NOT trusted.
  RUNWAY_FORWARDED_ALLOW_IPS: ${RUNWAY_FORWARDED_ALLOW_IPS:-172.30.0.1}

# The worker refreshes platform tokens and publishes, so it alone decrypts
# tokens and holds the platform app secrets. When the platform routes are
# served in hosted (OAuth connect runs in the API), the api service gains the
# client credentials and the token keys needed to store a new connection.
x-platform-secrets: &platform-secrets
  # Read once the database token store lands (spec 05 section 3): "v2:<key>,v1:<key>".
  RUNWAY_TOKEN_KEYS: ${RUNWAY_TOKEN_KEYS:-}
  RUNWAY_YOUTUBE_CLIENT_ID: ${RUNWAY_YOUTUBE_CLIENT_ID:-}
  RUNWAY_YOUTUBE_CLIENT_SECRET: ${RUNWAY_YOUTUBE_CLIENT_SECRET:-}
  RUNWAY_INSTAGRAM_APP_ID: ${RUNWAY_INSTAGRAM_APP_ID:-}
  RUNWAY_INSTAGRAM_APP_SECRET: ${RUNWAY_INSTAGRAM_APP_SECRET:-}
  RUNWAY_TIKTOK_CLIENT_KEY: ${RUNWAY_TIKTOK_CLIENT_KEY:-}
  RUNWAY_TIKTOK_CLIENT_SECRET: ${RUNWAY_TIKTOK_CLIENT_SECRET:-}

services:
  postgres:
    # Pinned by digest (postgres:17, read 2026-11-23).
    image: postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RUNWAY_DB_NAME:-runway}
      # Bootstrap superuser: used only by the init script and by the operator.
      POSTGRES_USER: ${RUNWAY_DB_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${RUNWAY_DB_SUPERUSER_PASSWORD:?bootstrap superuser password}
      RUNWAY_DB_OWNER: ${RUNWAY_DB_OWNER:-runway_owner}
      RUNWAY_DB_OWNER_PASSWORD: ${RUNWAY_DB_OWNER_PASSWORD:?migration owner password}
      RUNWAY_DB_APP: ${RUNWAY_DB_APP:-runway_app}
      RUNWAY_DB_APP_PASSWORD: ${RUNWAY_DB_APP_PASSWORD:?application role password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the owner role (migrations) and the app role (no BYPASSRLS).
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-runway-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
    # No published port: only the containers on this network reach Postgres.

  migrate:
    image: ${RUNWAY_IMAGE:-runway:local}
    command: ["db", "upgrade"]
    restart: "no"
    profiles: ["release"]
    environment:
      <<: *runway-env
      # The owner role owns the schema; only migrations connect as it.
      RUNWAY_DATABASE_URL: postgresql+psycopg://${RUNWAY_DB_OWNER:-runway_owner}:${RUNWAY_DB_OWNER_PASSWORD:?migration owner password}@postgres:5432/${RUNWAY_DB_NAME:-runway}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${RUNWAY_IMAGE:-runway:local}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["serve"]
    restart: unless-stopped
    environment:
      <<: *runway-env
      # Only the API receives Clerk webhooks.
      RUNWAY_CLERK_WEBHOOK_SECRET: ${RUNWAY_CLERK_WEBHOOK_SECRET:?whsec_ secret of the Clerk webhook endpoint}
      # The app role: no ownership, no BYPASSRLS, so row-level security holds.
      RUNWAY_DATABASE_URL: postgresql+psycopg://${RUNWAY_DB_APP:-runway_app}:${RUNWAY_DB_APP_PASSWORD:?application role password}@postgres:5432/${RUNWAY_DB_NAME:-runway}
    volumes:
      - runway-data:/data
    ports:
      - "127.0.0.1:${RUNWAY_API_HOST_PORT:-8080}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: ${RUNWAY_IMAGE:-runway:local}
    command: ["worker"]
    restart: unless-stopped
    environment:
      <<: [*runway-env, *platform-secrets]
      RUNWAY_DATABASE_URL: postgresql+psycopg://${RUNWAY_DB_APP:-runway_app}:${RUNWAY_DB_APP_PASSWORD:?application role password}@postgres:5432/${RUNWAY_DB_NAME:-runway}
    volumes:
      - runway-data:/data
    # The image's HTTP health check is for the API; the worker serves no HTTP.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${RUNWAY_WEB_IMAGE:-runway-web:local}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_RUNWAY_API_URL: ${RUNWAY_PUBLIC_API_URL:?https origin of the API as the browser sees it}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${RUNWAY_WEB_HOST_PORT:-3100}:3000"
    depends_on:
      - api

networks:
  default:
    ipam:
      config:
        # A fixed range so RUNWAY_FORWARDED_ALLOW_IPS can name the gateway
        # alone. Change both together if the range is taken on the host.
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  postgres-data:
  runway-data:
