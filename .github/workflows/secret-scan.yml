name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

# No concurrency block: a cancelled run must never leave pushed commits unscanned.

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the scan reads every commit reachable from HEAD.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      # Standard library only; the repository is small enough for every commit every time.
      - run: python scripts/secret_scan.py --all-history
