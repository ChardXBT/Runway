name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/unit/test_windows_launcher.py tests/unit/test_launcher_deploy.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: tests scan every commit of the repository.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --upgrade pip
      # Install the exact locked environment, then the project without re-resolving it.
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/runway
      - run: pytest
      - run: pip-audit

  backend-postgres:
    # The hosted profile runs on Postgres (spec 01 section 5): this job proves
    # every migration applies there, rolls back to the oldest supported
    # revision, applies again, and that the suite passes against the real
    # dialect with row-level security enforced.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: runway_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUNWAY_OWNER_DSN: postgresql+psycopg://runway_owner:ownerpw@127.0.0.1:5432/runway_test
      RUNWAY_APP_DSN: postgresql+psycopg://runway_app:apppw@127.0.0.1:5432/runway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: tests scan every commit of the repository.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      # The deploy image's two roles (deploy/postgres/init-roles.sh): the
      # owner migrates, the app serves - and has NOBYPASSRLS so the row-level
      # policies always apply to it.
      - name: Create the owner and app roles
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/runway_test" <<'SQL'
          CREATE ROLE runway_owner LOGIN PASSWORD 'ownerpw'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE runway_app LOGIN PASSWORD 'apppw'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          GRANT CONNECT, TEMPORARY ON DATABASE runway_test TO runway_owner, runway_app;
          ALTER SCHEMA public OWNER TO runway_owner;
          GRANT USAGE ON SCHEMA public TO runway_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE runway_owner IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO runway_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE runway_owner IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO runway_app;
          SQL
      # Migrate as the owner, roll back to the oldest supported revision,
      # migrate forward again.
      - name: Upgrade, downgrade, upgrade
        env:
          RUNWAY_DATABASE_URL: ${{ env.RUNWAY_OWNER_DSN }}
          RUNWAY_MIGRATION_DATABASE_URL: ${{ env.RUNWAY_OWNER_DSN }}
          RUNWAY_DATA_DIR: /tmp/runway-pg-ci
        run: |
          runway db upgrade --no-backup
          runway db downgrade 0012_creator_platforms --i-have-a-backup
          runway db upgrade --no-backup
      # The suite: every test gets its own schema (tests/conftest.py) in the
      # shared database, connected as the NOBYPASSRLS app role. The
      # postgres-marked tests also take the plain DSN for raw-SQL checks.
      - name: pytest against Postgres
        env:
          RUNWAY_TEST_DATABASE_URL: ${{ env.RUNWAY_APP_DSN }}
        run: python -m pytest tests/unit --postgres-dsn="$RUNWAY_APP_DSN"

  container-image:
    # Builds the hosted images on every push to prove the Dockerfiles work.
    # Nothing is pushed to any registry and no secrets are used.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull --tag runway:ci .
      - name: Image runs as a non-root user with ffmpeg and the CLI
        run: |
          test "$(docker run --rm --entrypoint id runway:ci -u)" != "0"
          docker run --rm --entrypoint ffprobe runway:ci -version
          docker run --rm runway:ci db --help
          docker run --rm runway:ci hosted --help
      - run: docker build --pull --file deploy/web.Dockerfile --tag runway-web:ci .
      - name: Compose file is valid with placeholder values
        env:
          RUNWAY_CLERK_ISSUER: https://clerk.example.invalid
          RUNWAY_CLERK_WEBHOOK_SECRET: whsec_placeholder
          RUNWAY_WEB_ORIGINS: https://app.example.invalid
          RUNWAY_OAUTH_REDIRECT_BASE_URL: https://api.example.invalid
          RUNWAY_PUBLIC_API_URL: https://api.example.invalid
          RUNWAY_DB_SUPERUSER_PASSWORD: placeholder
          RUNWAY_DB_OWNER_PASSWORD: placeholder
          RUNWAY_DB_APP_PASSWORD: placeholder
        run: docker compose -f deploy/compose.hosted.yml --profile release config --quiet
      - run: bash -n deploy/backup.sh && bash -n deploy/restore.sh && bash -n deploy/postgres/init-roles.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit
      # Production dependencies: no exceptions of any kind.
      - run: npm --prefix apps/web audit --omit=dev
      # Full tree: fails on anything except a reviewed, unexpired, dev-only exception.
      - run: node scripts/audit_web_dependencies.mjs
