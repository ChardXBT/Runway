[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "runway-local"
version = "0.1.0"
description = "Local-only, channel-adaptive YouTube Community-post intelligence and planning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Runway" }]
dependencies = [
  "alembic>=1.14,<2",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "openai>=1.60,<3",
  "pillow>=11,<13",
  "playwright>=1.49,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
intelligence-ml = [
  "sentence-transformers>=5,<6",
  "torch>=2.6,<3",
  "transformers>=4.53,<6",
]

[project.scripts]
runway = "runway.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/runway"]

[tool.hatch.build.targets.sdist]
include = ["src/runway", "README.md", "alembic", "alembic.ini"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["runway"]
exclude = ["alembic"]
